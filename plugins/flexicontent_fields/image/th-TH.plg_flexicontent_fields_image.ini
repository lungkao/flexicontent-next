FLEXI_FIELD_AUTO_INSERT_UPLOADED_IMAGES_DESC="เปิดใช้งานเพื่อปิด popup file-management อัตโนมัติและกำหนดรูปภาพที่อัปโหลดใหม่ให้ value box รูปภาพปัจจุบัน <br/><br/>หมายเหตุ: หากอัปโหลดรูปภาพใหม่หลายรูป value boxes จะถูกเพิ่มต่อจากปัจจุบัน"
FLEXI_FIELD_PROTECT_ORIGINAL="ป้องกันการเข้าถึงรูปภาพต้นฉบับ"
FLEXI_FIELD_PROTECT_ORIGINAL_DESC="โดยปกติคุณจะต้องการป้องกันการเข้าถึงไฟล์รูปภาพต้นฉบับ (การตั้งค่านี้สำหรับ folder mode <b>ในกรณีของ DB-mode รูปจะถูกป้องกันเสมอ</b>) <br/><br/>หากคุณใช้รูปภาพต้นฉบับในพารามิเตอร์การตั้งค่าต่างๆ คุณต้องปิดการตั้งค่านี้ ไม่เช่นนั้นลิงก์รูปภาพจะได้รับ server deny error"

