FLEXI_FIELD_GROUP_THUMBS_WITH_OTHER_IMAGE_FIELDS_DESC="เปิดใช้งานเพื่อให้ฟิลด์เข้าร่วมในกลุ่มลูกโซ่ของรูปภาพพร้อมปุ่ม next และ previous<br/><br/><b>หมายเหตุ:</b> <br/> -- ไม่รองรับโดย JS gallery ทุกประเภท เช่น ไม่รองรับ Rockbox popup <br/><br/><b>หมายเหตุ:</b><br/> (a) <b>ต่อบทความ</b> จะจัดกลุ่มฟิลด์รูปภาพทั้งหมดของแต่ละบทความ เช่น ในมุมมองหมวดหมู่ รูปภาพจะถูกจัดกลุ่มต่อบทความ และในมุมมองบทความด้วย<br/> (b) <b>ต่อมุมมอง</b> จะจัดกลุ่มฟิลด์รูปภาพตามมุมมองที่แสดง: รูปภาพทั้งหมดของมุมมองบทความ รูปภาพทั้งหมดของมุมมองหมวดหมู่ รูปภาพทั้งหมดของโมดูล FLEXIcontent ทั้งหมด"

FLEXI_FIELD_IMAGE_FOLDER="โฟลเดอร์รูปย่อ <br/><small> * โหมด Folder จะสร้าง subfolder ต่อบทความ</small>"
FLEXI_FIELD_IMAGE_FOLDER_DESC="โฟลเดอร์ที่จะเก็บรูปย่อ <b>relative กับเว็บ Joomla ของคุณ</b> (ไม่มี slash นำหน้าและท้าย!) <br/><br/> หากเปิดใช้งาน <b>Folder mode</b> จะสร้าง <b>subdirectories</b> สำหรับทุกบทความ และรูปภาพต้นฉบับจะถูกวางที่นี่แทนที่จะอยู่ใน Global FLEXIcontent document (secure) folder"
FLEXI_FIELD_IMAGE_SRC_MODE="แหล่งรูปภาพ"
FLEXI_FIELD_IMAGE_SRC_MODE_DESC="<b>อย่าเปลี่ยนหลังจากเพิ่มค่าแล้ว แนะนำให้ใช้ folder mode เมื่อสร้างฟิลด์ gallery</b> <br/><br/>a. ใช้ <b>DB MODE</b> เมื่อกำหนดรูปภาพคุณสมบัติให้บทความที่ต้อง <b>ใช้ซ้ำ</b> โดยหลายบทความ และต้องการ <u>ตัวเลือกเพิ่มเติม</u> นอกเหนือจากที่ <u>radio-image</u> และ <u>checkbox-image</u> field TYPEs ให้ <br/><br/> เช่น คุณสมบัติพร้อมรายละเอียดและลิงก์ popup เป็นต้น <br/><br/> b. ใช้ <b>FOLDER mode</b> เมื่อมีรูปภาพที่ไม่ใช้ซ้ำ <br/><br/> เช่น แกลเลอรีรูปภาพที่เฉพาะของแต่ละบทความ"

