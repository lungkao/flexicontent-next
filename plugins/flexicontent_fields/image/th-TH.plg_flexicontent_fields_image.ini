FLEXI_FIELD_INCLUDE_IMAGES_UPLOADED_FIELD="รวมที่เพิ่มโดย *"
FLEXI_FIELD_INCLUDE_IMAGES_UPLOADED_FIELD_DESC="เปิด/ปิดการรวมรูปภาพที่อัปโหลดโดยฟิลด์อื่นหรือผ่าน file manager (หรือคือรูปภาพทั้งหมดในโฟลเดอร์ secure)<br/><br/> หมายเหตุ 1: ฟิลด์รูปภาพไม่ได้เก็บรูปภาพในโฟลเดอร์ DB media แต่ในโฟลเดอร์ DB secure เพื่อจุดประสงค์ในการป้องกันการเข้าถึงไฟล์รูปภาพต้นฉบับ<br/><br/>หมายเหตุ 2: คุณสามารถเลือกให้เพิ่ม _fldNN_ ในชื่อรูปย่อโดยอัตโนมัติ หรือเลือกใช้โฟลเดอร์รูปย่อเฉพาะ แต่ต้องตั้งโฟลเดอร์รูปย่อเฉพาะสำหรับฟิลด์นี้ !!! ไม่เช่นนั้นฟิลด์จะเขียนทับรูปย่อของกันและกันอย่างต่อเนื่อง<br/><br/> หมายเหตุ 3: หากเปิดใช้งานการเลือกรูปภาพที่ถูกเพิ่มโดยฟิลด์ใดๆ หรือ filemanager การลบรูปภาพจะถูกปิดใช้งาน"

FLEXI_FIELD_LIMIT_TO_USER_UPLOADED="รวมที่อัปโหลดโดย"
FLEXI_FIELD_LIMIT_TO_USER_UPLOADED_DESC="เมื่อแสดงรายการรูปภาพที่อัปโหลดโดยฟิลด์ใดๆ หรือ filemanager คุณสามารถจำกัดให้เฉพาะที่อัปโหลดโดยผู้ใช้ปัจจุบัน (แนะนำ)"

FLEXI_FIELD_UNIQUE_THUMB_METHOD="รูปย่อเฉพาะผ่าน"
