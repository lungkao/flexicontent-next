FLEXI_FIELD_LINKSLIST="ปลั๊กอินฟิลด์ Links List สำหรับ FLEXIcontent"

FLEXI_FIELD_LINKSLIST_LIST_ELEMENTS="Elements ของรายการ"
FLEXI_FIELD_LINKSLIST_LIST_ELEMENTS_DESC="Elements ของ unordered list (&lt;&zwnj;UL&zwnj;&gt;) หรือ ordered list (&lt;&zwnj;OL&zwnj;&gt;) <br/><br/> รูปแบบเป็นดังนี้: <br/> &nbsp; Title1[id=&quot;tagid1&quot; class=&quot;cssclass1&quot; ... link=&quot;#link1&quot;] &#x3a;&#8203;&#x3a; <br/> &nbsp; Title2[id=&quot;tagid2&quot; class=&quot;cssclass2&quot; ... link=&quot;#link2&quot;] &#x3a;&#8203;&#x3a; <br/> &nbsp; Title3[id=&quot;tagid3&quot; class=&quot;cssclass3&quot; ... link=&quot;#link3&quot;] <br/><br/><b>หมายเหตุ 1:</b> <br/> - ใช้ &#x3a;&#8203;&#x3a; เป็นตัวคั่น elements ของรายการ <br/> - ใช้ [option=value] เพื่อระบุตัวเลือกของแต่ละ element <br/><br/><b>หมายเหตุ 2:</b><br/> - 'title' คือข้อความภายใน HTML tag &lt;&zwnj;LI&zwnj;&gt; <br/> - 'title' จะกลายเป็นลิงก์ (อยู่ใน HTML tag &lt;&zwnj;A&zwnj;&gt;) เฉพาะเมื่อระบุตัวเลือก 'link' <br/> - ตัวเลือกทั้งหมด เช่น id, class, ... (ยกเว้น 'link') จะกลายเป็นพารามิเตอร์ของ HTML tag &lt;&zwnj;LI&zwnj;&gt; <br/><br/><b>หมายเหตุ 3:</b> ตัวเลือกทั้งหมด (รวมถึง 'link') เป็นทางเลือก จึงสามารถเขียน TitleNN[] โดยไม่ระบุตัวเลือกใดเลยได้"

FLEXI_FIELD_LIST_CLASS="คลาสของรายการ"
FLEXI_FIELD_LIST_CLASS_DESC="เพิ่มคลาสให้กับรายการ ปล่อยว่างหากไม่ต้องการ"

FLEXI_FIELD_LINKSLIST_LIST_TAG_PARAMS="พารามิเตอร์ของ HTML TAG"

FLEXI_FIELD_LIST_ID="ID ของรายการ"
FLEXI_FIELD_LIST_ID_DESC="เพิ่ม ID ให้กับรายการ ปล่อยว่างหากไม่ต้องการ"
FLEXI_FIELD_LIST_TYPE="ประเภทรายการ"
FLEXI_FIELD_LIST_TYPE_DESC="กำหนดประเภทของรายการ โดยทั่วไปคือ 'ul'"

FLEXI_FIELD_LINKSLIST_CUSTOM_CSS_JS="JS/CSS กำหนดเอง"

FLEXI_FIELD_LINKSLIST_JS_CODE="โค้ด Javascript"
FLEXI_FIELD_LINKSLIST_JS_CODE_DESC="โค้ด javascript เพิ่มเติม (ไม่จำเป็น) ที่จะเพิ่มในมุมมอง frontend เมื่อแสดงฟิลด์นี้ คุณจึงสามารถผูก JS กับลิงก์ที่ฟิลด์นี้แทรกเข้าไป และสร้าง action ที่คลิกได้เพื่อจัดการหน้าเว็บตามต้องการ <br/><br/><b>หมายเหตุ</b> โค้ด JS จะถูกเพิ่มแม้ว่าฟิลด์นี้จะไม่ได้แทรกลิงก์ใดเลย ดังนั้นโค้ด JS ของคุณต้องผูกด้วย jQuery selector ที่เหมาะสม ซึ่งอาจจะหาเจอหรือไม่เจอก็ได้ <br/><br/><b>หมายเหตุ</b>: จะถูกเพิ่มเพียงครั้งเดียว ทั้งในมุมมองบทความและมุมมองหลายบทความเมื่อมีการแสดงฟิลด์นี้ หรือเพิ่มแบบถาวรในไฟล์ JS ของคุณก็ได้"
FLEXI_FIELD_LINKSLIST_CSS_CODE="กฎ CSS"
FLEXI_FIELD_LINKSLIST_CSS_CODE_DESC="กฎ CSS เพิ่มเติม (ไม่จำเป็น) ที่จะเพิ่มในมุมมอง frontend เมื่อแสดงฟิลด์นี้ <br/><br/><b>หมายเหตุ</b>: จะถูกเพิ่มเพียงครั้งเดียว ทั้งในมุมมองบทความและมุมมองหลายบทความเมื่อมีการแสดงฟิลด์นี้ หรือเพิ่มแบบถาวรในไฟล์ CSS ของคุณก็ได้"

FLEXI_FIELD_LIST_ADD_NON_SELECTED="แสดงค่าที่ไม่ได้เลือกโดยไม่มีลิงก์"
FLEXI_FIELD_LIST_ADD_NON_SELECTED_DESC="ปกติค่าที่ไม่ได้เลือกจะไม่รวมในรายการที่สร้าง เปิดตัวเลือกนี้เพื่อแสดงโดยไม่มีแท็กลิงก์ แต่จะเพิ่ม SPAN tag แทน"
