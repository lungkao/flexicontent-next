PLG_FLEXICONTENT_FIELDS_SHAREDMEDIA="ฟิลด์นี้ฝังตัวเล่นสื่อ (วิดีโอ/เสียง) ลงในบทความ จากเว็บไซต์วิดีโอที่แชร์ได้ เช่น YouTube, Vimeo, Dailymotion, Vevo, Hulu, Metacafe เป็นต้น และเว็บไซต์เสียง เช่น soundclound, last.fm เป็นต้น<br/><br/> สามารถเพิ่มรายการอ้างอิงสื่อ (ค่าฟิลด์) ในฟิลด์นี้ได้โดยเพียงคัดลอก URL ของหน้าสื่อต้นทาง ระบบจะดึงข้อมูลสื่อ (ชื่อเรื่อง ผู้เขียน รายละเอียด ฯลฯ) และฝังตัวเล่นตัวอย่างเมื่อแสดงฟิลด์ การตั้งค่าฟิลด์อนุญาตให้ควบคุมข้อมูลที่แสดงรวมถึงขนาดของตัวเล่น ยกเว้น YouTube, Vimeo และ Dailymotion ความสามารถในการดึงข้อมูลจะใช้บริการ embed.ly ซึ่งใช้งานฟรีได้สูงสุด 5,000 URL ต่อเดือน แนะนำให้ขอและกรอก embed.ly API key ของคุณเอง"
