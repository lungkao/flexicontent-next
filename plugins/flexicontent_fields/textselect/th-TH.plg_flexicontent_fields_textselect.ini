FLEXI_FIELD_SELECT_ELEMENTS="ค่าของ Element"
FLEXI_FIELD_SELECT_ELEMENTS_DESC="Elements กำหนดเองหรือ SQL query <br/><br/>สำหรับ <b>custom elements</b> รูปแบบเป็นดังนี้:<br> value1:<span></span>:label1%% &nbsp; value2:<span></span>:label2%% &nbsp; <br/><br/>สำหรับ <b>SQL query</b> กรอก:<br/> SELECT value, value as text FROM #__flexicontent_fields_item_relations WHERE field_id='{field_id}' AND value != '' GROUP BY value<br/><br/> <b>คุณสามารถใส่ค่าแทนที่</b>: สำหรับข้อมูลฟิลด์ปัจจุบัน: {field->id} {field->field_type} และข้อมูลบทความ: {item->created_by} {item->catid} เป็นต้น <br><b>หมายเหตุ</b>:<br> ชื่อจะถูกส่งผ่าน JText ... เพื่อรองรับหลายภาษา (สามารถเพิ่มลงในไฟล์ภาษาของคุณ)"

FLEXI_FIELD_SELECT_FIELD_PROMPT="ข้อความตัวเลือกแรก<br/><small>(ข้อความแนะนำ)</small>"
FLEXI_FIELD_SELECT_FIELD_PROMPT_DESC="ข้อความของตัวเลือกแรกใน Drop-Down Select เช่น 'เลือกค่าที่มีอยู่' เป็นต้น <br/><br/><b>หมายเหตุ</b>: ตัวเลือกนี้ไม่มีค่า <br/><br/><b>หมายเหตุ</b>: ข้อความนี้ผ่านตัวกรองภาษา จึงสามารถใส่ข้อความที่แทนค่าผ่านภาษาได้"

