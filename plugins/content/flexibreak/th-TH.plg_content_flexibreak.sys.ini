PLG_CONTENT_FLEXIBREAK="Content - Flexibreak, การแบ่งหน้าสำหรับบทความหลายหน้า"
PLG_CONTENT_FLEXIBREAK_DESCRIPTION="FLEXIcontent ทางเลือกแทนปลั๊กอิน pagebreak มาตรฐาน (มีการแบ่งหน้าทันทีด้วย javascript และทางเลือกอื่น ๆ) อนุญาตให้สร้างบทความที่แบ่งหน้าพร้อมตัวเลือกสารบัญ แทรกตัวแบ่งหน้าด้วยปุ่ม page break ที่อยู่ใต้แผงข้อความในบทความ ตัวแบ่งหน้าจะถูกแสดงในหน้าต่างข้อความเป็นเส้นแนวนอนธรรมดา<br />ข้อความที่แสดงจะขึ้นอยู่กับตัวเลือกที่เลือก อาจเป็นชื่อเรื่อง, ข้อความสำรอง (หากระบุ) หรือหมายเลขหน้า <br/> <br/> รูปแบบ HTML คือ:<br/> &lt;hr class='system-pagebreak' /&gt;<br />&lt;hr class='system-pagebreak' title='The page title' /&gt; หรือ <br />&lt;hr class='system-pagebreak' alt='The first page' /&gt; หรือ <br />&lt;hr class='system-pagebreak' title='The page title' alt='The first page' /&gt; หรือ <br />&lt;hr class='system-pagebreak' alt='The first page' title='The page title' /&gt;"
