FLEXI_EXT_SHOW_HIDE_JCACHE_CONF_NOTE="โปรดทราบว่าหาก <b>Joomla Caching</b> เปิดใช้งานอยู่ใน <b>การตั้งค่าทั่วไป</b> ของ Joomla แล้ว <br/> - ให้เปิดใช้งาน '<b>Platform specific caching</b>' (โปรดทราบว่า 'tablet' จะถูกตรวจพบเป็น 'mobile') <br/> - หรือปิด caching ในแท็บ 'Advanced setting' ของโมดูลนี้ <br/> หากไม่ได้ดำเนินการอย่างใดอย่างหนึ่งข้างต้น การตั้งค่านี้จะถูกละเว้น"
