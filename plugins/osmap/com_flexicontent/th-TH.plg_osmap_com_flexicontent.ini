; OSMAP Plugin for FLEXIcontent Component

; About including or not including the content Item links in the sitemap
OSMAP_FLEXICONTENT_ITEMS_IN_SITEMAP_SEP="<strong>บทความใน Sitemap</strong>"
OSMAP_FLEXICONTENT_SHOW_ITEMS_LABEL="แสดง (ขยายมุมมอง)"
OSMAP_FLEXICONTENT_SHOW_ITEMS_DESC="ต้องการรวมบทความใน sitemap หรือไม่? <br/><br/> <b>หมายเหตุ</b>: มีผลกับทุกมุมมอง 'ที่ขยายได้' ของ FLEXIcontent"
OSMAP_FLEXICONTENT_SHOW_ITEMS_IN_MAINCAT_ONLY_LABEL="เฉพาะหมวดหมู่หลักเท่านั้น"
OSMAP_FLEXICONTENT_SHOW_ITEMS_IN_MAINCAT_ONLY_DESC="FLEXIcontent อนุญาตให้บทความอยู่ในหลายหมวดหมู่ได้ ซึ่งอาจทำให้บทความถูกแสดงซ้ำใน Sitemap คุณสามารถหลีกเลี่ยงปัญหานี้ได้โดยแสดงแต่ละบทความเฉพาะภายในหมวดหมู่หลักเท่านั้น"

; About expanding or not expanding the "expandable" MENU Iitems, e.g. CATEGORY-LIKE views and TAG views
OSMAP_FLEXICONTENT_EXPAND_LINKS_SEP="<hr/><strong>ขยายลิงก์ (รวมบทความที่อยู่ภายใน)</strong>"
OSMAP_FLEXICONTENT_EXPAND_CATEGORY_LINKS_LABEL="ขยายลิงก์หมวดหมู่"
OSMAP_FLEXICONTENT_EXPAND_CATEGORY_LINKS_DESC="เมนูแบบหมวดหมู่ (เดี่ยว/หลายหมวดหมู่) จะถูกขยายเพื่อรวมบทความทั้งหมด ปกติควรเปิดใช้งานตัวเลือกนี้ เว้นแต่จะมีบทความจำนวนมากเกินไป หรือต้องการเพิ่มบทความใน sitemap ด้วยวิธีอื่น เช่น ผ่านมุมมองตามแท็กหรือตามผู้เขียน"
OSMAP_FLEXICONTENT_EXPAND_AUTHOR_LINKS_LABEL="ขยายลิงก์ผู้เขียน"
OSMAP_FLEXICONTENT_EXPAND_AUTHOR_LINKS_DESC="เมนูผู้เขียนจะถูกขยายเพื่อรวมบทความทั้งหมดที่เป็นของผู้เขียนคนนั้น หากเปิดใช้งาน ให้ระวังว่าบทความอาจถูกแสดงในหมวดหมู่ด้วย ทำให้แสดงซ้ำหลายครั้ง"
OSMAP_FLEXICONTENT_EXPAND_TAG_LINKS_LABEL="ขยายลิงก์แท็ก"
OSMAP_FLEXICONTENT_EXPAND_TAG_LINKS_DESC="เมนูแท็กจะถูกขยายเพื่อรวมบทความที่ติดแท็กทั้งหมด หากเปิดใช้งาน ให้ระวังว่าบทความอาจถูกแสดงในหมวดหมู่ด้วย ทำให้แสดงซ้ำหลายครั้ง"

; Size, Time, etc limits
OSMAP_FLEXICONTENT_CONTENT_LIMITS_SEP="ข้อจำกัดการแสดงผลและเนื้อหาที่ไม่มีสิทธิ์<hr/>"
OSMAP_FLEXICONTENT_MAX_ITEMS_PER_CATEGORY_LABEL="จำนวนบทความสูงสุดต่อหมวดหมู่"
OSMAP_FLEXICONTENT_MAX_ITEMS_PER_CATEGORY_DESC="จำนวนบทความสูงสุดต่อหมวดหมู่ที่จะรวมใน sitemap (เว้นว่างหากไม่ต้องการจำกัด) เป็นการจำกัดเชิงป้องกันสำหรับหมวดหมู่ที่มีบทความจำนวนมาก"
OSMAP_FLEXICONTENT_MAX_AGE_IN_DAYS_LABEL="อายุสูงสุดเป็นวัน"
OSMAP_FLEXICONTENT_MAX_AGE_IN_DAYS_DESC="อายุสูงสุดของบทความที่จะรวมใน sitemap (เว้นว่างหากไม่ต้องการจำกัด) ตั้งค่านี้หากเนื้อหาเก่าหมดความสำคัญ เช่น เว็บไซต์ข่าว"
OSMAP_FLEXICONTENT_SHOW_UNAUTHORIZED_LINKS_LABEL="แสดงลิงก์ที่ไม่มีสิทธิ์"
OSMAP_FLEXICONTENT_SHOW_UNAUTHORIZED_LINKS_DESC="เลือกเพื่อรวมลิงก์ของเนื้อหาที่ไม่มีสิทธิ์ดู (เนื้อหาที่ใช้ได้เฉพาะผู้ใช้ที่ลงทะเบียน) ควรตั้งค่าให้ตรงกับการตั้งค่า Show Unauthorised Links ในการตั้งค่าคอมโพเนนต์ FLEXIcontent ผู้ใช้ที่ไม่มีสิทธิ์ดูจะถูก redirect ไปยังหน้าเข้าสู่ระบบของ Joomla"

