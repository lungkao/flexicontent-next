PLG_SEARCH_FLEXIADVSEARCH="Search - Flexiadvsearch, มุมมองการค้นหาของ FLEXIcontent"
PLG_SEARCH_FLEXIADVSEARCH_DESCRIPTION="ปลั๊กอินค้นหาสำหรับมุมมองการค้นหาขั้นสูงของ FLEXIcontent นอกจากค้นหาในชื่อเรื่องและรายละเอียดของบทความแล้ว ยังสามารถค้นหาในฟิลด์ flexicontent ใด ๆ ที่สามารถสร้างข้อมูลค้นหาได้ เช่น ฟิลด์แท็ก, ฟิลด์ข้อความ, ฟิลด์รูปภาพ (เช่น รายละเอียด) ฯลฯ <br><b>หมายเหตุ:</b> ควรปิดปลั๊กอินค้นหา 'content' ของ Joomla แต่ไม่ต้องปิดปลั๊กอินสำหรับเนื้อหาเว็บไซต์ประเภทอื่น"

